on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish (required for manual runs)"
        required: false
        type: string

name: Release

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4.4.4

      - name: Run unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

  release:
    needs: test
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23

      - name: nix shell
        run: nix develop -L --verbose

      - name: parse version from tag
        id: version
        if: ${{ github.ref_type == 'tag' || inputs.release_tag != '' }}
        run: |
          set -e
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a valid semver (expected MAJOR.MINOR.PATCH, optionally prefixed with 'v')"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          for COMPONENT in "$MAJOR" "$MINOR" "$PATCH"; do
            if [ "$COMPONENT" -gt 99 ]; then
              echo "::error::Version component '$COMPONENT' exceeds 99 (MMmmpp scheme limit)"
              exit 1
            fi
          done
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Parsed version: $VERSION (major=$MAJOR minor=$MINOR patch=$PATCH)"

      - name: build tafh_jni
        run: |
          nix develop -c bash -c '
            set -e
            cd zig-src
            zig build -Doptimize=ReleaseSmall -Dtarget=aarch64-linux-android.24 jni
          '

      # The encrypted backup container lives in Rust now; without this the APK
      # ships no libtafh_backup.so and backup export/import fails on device only.
      # This runs on the runner's rustup toolchain, NOT inside `nix develop`: only
      # rustup can install the Android rust-std targets, and nixpkgs rustc has none.
      - name: build tafh_backup (Rust)
        run: |
          set -euo pipefail
          NDK_HOME="$(nix develop -c printenv ANDROID_NDK_HOME)"
          export ANDROID_NDK_HOME="$NDK_HOME"
          rustup target add aarch64-linux-android
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
          cd rust
          cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release -p tafh-backup

      # Signing material is per-repository: secrets do not transfer to a fork, and
      # an unsigned APK cannot be installed. Normalise whatever shape the pasted
      # secret arrived in, then prove it is usable before building anything.
      - name: generate release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          RAW="${KEYSTORE_BASE64:-}"
          if [ -z "$RAW" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD (README, 'Signing')."
            exit 1
          fi
          # Pasted secrets commonly arrive quoted, wrapped, CRLF-terminated, as a
          # data: URI, with literal backslash-n escapes, or with the base64 '='
          # padding stripped by a shell round-trip. Undo all of that here.
          S="$RAW"
          S="${S#\"}"; S="${S%\"}"; S="${S#\'}"; S="${S%\'}"
          S="${S#data:*base64,}"
          S="$(printf '%s' "$S" | sed 's/\\n//g')"
          S="$(printf '%s' "$S" | tr -- '-_' '+/')"
          S="$(printf '%s' "$S" | tr -cd 'A-Za-z0-9+/=')"
          REM=$(( ${#S} % 4 ))
          if [ "$REM" -eq 2 ]; then S="${S}=="
          elif [ "$REM" -eq 3 ]; then S="${S}="
          elif [ "$REM" -eq 1 ]; then
            echo "::error::KEYSTORE_BASE64 has a length that cannot be base64 (${#S} chars). Re-create it with: base64 -w0 release.jks"
            exit 1
          fi
          if ! printf '%s' "$S" | base64 -d > android/app/key.jks 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 does not decode as base64."
            exit 1
          fi
          # A double-encoded paste decodes to base64 text rather than binary.
          MAGIC=$(od -An -tx1 -N4 android/app/key.jks | tr -d ' \n')
          if [ "$MAGIC" != "feedfeed" ] && [ "${MAGIC:0:2}" != "30" ]; then
            if head -c 64 android/app/key.jks | grep -qE '^[A-Za-z0-9+/=]+$'; then
              echo "note: secret was base64-encoded twice; decoding again"
              base64 -d < android/app/key.jks > android/app/key.decoded && mv android/app/key.decoded android/app/key.jks
              MAGIC=$(od -An -tx1 -N4 android/app/key.jks | tr -d ' \n')
            fi
          fi
          SIZE=$(wc -c < android/app/key.jks)
          if [ "$SIZE" -lt 512 ]; then
            echo "::error::Decoded keystore is only ${SIZE} bytes; that cannot be a keystore."
            exit 1
          fi
          case "$MAGIC" in
            feedfeed*|30*) : ;;
            *)
              echo "::error::Decoded file is not a JKS/PKCS12 keystore (magic ${MAGIC})."
              exit 1
              ;;
          esac
          # Final proof: the credentials must actually open this keystore.
          if ! keytool -list -keystore android/app/key.jks -storepass "$KEYSTORE_PASSWORD" \
                 -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore decoded, but KEYSTORE_PASSWORD / KEY_ALIAS do not open it. Check those two secrets."
            exit 1
          fi
          echo "keystore OK (${SIZE} bytes, magic ${MAGIC}, alias ${KEY_ALIAS} present)"

      - name: build android release artifacts (APK + AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_MAJOR: ${{ steps.version.outputs.major }}
          VERSION_MINOR: ${{ steps.version.outputs.minor }}
          VERSION_PATCH: ${{ steps.version.outputs.patch }}
          ANDROID_ABI_FILTERS: arm64-v8a
        run: |
          nix develop -c bash -c '
            set -e
            cd android
            chmod +x ./gradlew
            if [ -f local.properties ]; then chmod -w local.properties; fi
            ./gradlew assembleRelease bundleRelease
          '

      - name: upload release
        if: ${{ github.ref_type == 'tag' || inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: |
            ./android/app/build/outputs/apk/release/*.apk
            ./android/app/build/outputs/bundle/release/*.aab
          fail_on_unmatched_files: true

